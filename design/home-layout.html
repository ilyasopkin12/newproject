<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedSync - Static Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <div class="min-h-screen bg-slate-50">
      <aside class="fixed h-full w-64 border-r border-slate-200 bg-white">
        <div class="flex items-center gap-3 p-6">
          <div
            class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-600 text-white"
          >
            +
          </div>
          <span class="text-xl font-bold tracking-tight text-blue-600"
            >MedSync</span
          >
        </div>

        <nav class="space-y-1 px-4 py-4">
          <button
            class="w-full rounded-xl bg-blue-50 px-4 py-3 text-left font-semibold text-blue-600"
          >
            Дашборд
          </button>
          <button
            class="w-full rounded-xl px-4 py-3 text-left text-slate-500 hover:bg-slate-50 hover:text-slate-900"
          >
            Мои записи
          </button>
          <button
            class="w-full rounded-xl px-4 py-3 text-left text-slate-500 hover:bg-slate-50 hover:text-slate-900"
          >
            Сообщения
          </button>
          <button
            class="w-full rounded-xl px-4 py-3 text-left text-slate-500 hover:bg-slate-50 hover:text-slate-900"
          >
            Поиск врачей
          </button>
          <button
            class="w-full rounded-xl px-4 py-3 text-left text-slate-500 hover:bg-slate-50 hover:text-slate-900"
          >
            Настройки
          </button>
        </nav>

        <div class="absolute bottom-0 w-full border-t border-slate-100 p-4">
          <button
            class="w-full rounded-xl px-4 py-3 text-left text-slate-500 hover:bg-slate-50 hover:text-slate-900"
          >
            Выйти
          </button>
        </div>
      </aside>

      <main class="ml-64 p-6">
        <header class="flex w-full items-center justify-between gap-10">
          <div>
            <h1 class="text-2xl font-bold">
              Добро пожаловать, Александр Волков
            </h1>
            <p class="text-slate-500">
              Найдите подходящего специалиста и запишитесь на прием.
            </p>
          </div>

          <div class="flex items-center gap-4">
            <input
              class="w-80 rounded-xl border border-slate-200 bg-white px-4 py-2 outline-none focus:border-blue-400"
              placeholder="Врачи, клиники, услуги..."
            />
            <button
              class="rounded-xl border border-slate-200 bg-white px-4 py-2"
            >
              Уведомления
            </button>

            <div class="flex items-center gap-3 border-l border-slate-200 pl-4">
              <div class="text-right">
                <p class="text-sm font-bold">Александр</p>
                <p class="text-xs text-slate-500">Пациент</p>
              </div>
              <div
                class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 font-bold text-blue-600"
              >
                А В
              </div>
            </div>
          </div>
        </header>
      </main>
    </div>
  </body>
</html>
